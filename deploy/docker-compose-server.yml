services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: klacks-postgres
    restart: unless-stopped
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=512MB
      -c effective_cache_size=1GB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
    environment:
      POSTGRES_DB: Klacks
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PGDATA: /var/lib/postgresql/data/pgdata
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - klacks_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d Klacks"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: klacks-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@klacks.app}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD must be set}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    expose:
      - "80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - klacks_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/misc/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  klacks-api:
    image: ghcr.io/heribertg/klacks-api:${KLACKS_API_TAG:-latest}
    container_name: klacks-api
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=Klacks;Username=admin;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - ServerIp=${SERVER_IP:-157.180.42.127}
      - JwtSettings__Secret=${JWT_SECRET:?JWT_SECRET must be set}
      - JwtSettings__ValidAudience=https://${DOMAIN:-klacks.site}
      - JwtSettings__ValidIssuer=https://${DOMAIN:-klacks.site}:5443
      - PasswordReset__BaseUrl=https://${DOMAIN:-klacks.site}:7443
      - Cors__Host=https://${DOMAIN:-klacks.site}
      - Cors__Home=https://${DOMAIN:-klacks.site}
      - Update__ManifestBaseUrl=${UPDATE_MANIFEST_BASE_URL:-}
      - RegionSetup__File=${REGION_SETUP_FILE:-}
      - Assistant__AnswerGroundingMode=${ANSWER_GROUNDING_MODE:-Off}
      # This compose file runs the public demo/Playground instance, the only Klacks instance
      # currently deployed - the seeded admin@test.com account staying active there is intentional.
      # Never set this on a customer's on-prem stack (deploy/onprem/docker-compose.yml has no such
      # variable, so it defaults to false there).
      - Deployment__IsPlayground=${DEPLOYMENT_IS_PLAYGROUND:-true}
      # DataProtection key ring. Set both to move the ring into the database, so a single pg_dump
      # covers it - the ring rotates every 90 days, which makes a separate volume backup go stale
      # unnoticed. The certificate is what keeps the dump from becoming the master key; without it
      # the app falls back to the api-dataprotection volume and logs a warning.
      # Losing the certificate means losing every stored secret, so save it once, offline.
      - DataProtection__CertificateBase64=${DATAPROTECTION_CERT_BASE64:-}
      - DataProtection__CertificatePassword=${DATAPROTECTION_CERT_PASSWORD:-}
      # Loopback address the assistant calls itself on. Must match ASPNETCORE_URLS above
      # (plain http inside the container, TLS terminates at the proxy) — the https default
      # from appsettings.json would fail here with no listener and no certificate.
      - SelfApi__BaseUrl=http://localhost:5000
      # SignalR backplane. Empty (the default) means one instance and the in-process behaviour every
      # installation runs today, and no extra service is shipped for it. A second klacks-api instance
      # needs a backplane, and only then: run any RESP-compatible server yourself and point this at it,
      # for example "valkey:6379" (Valkey is BSD-3-licensed, unlike Redis since 7.4). Klacks ships only
      # the MIT-licensed client library, so choosing that server stays the operator's decision.
      # Switching it on also means sticky sessions in the proxy - the nginx template carries a
      # commented ip_hash upstream for exactly that.
      - SignalR__Backplane__ConnectionString=${SIGNALR_BACKPLANE_CONNECTIONSTRING:-}
      # Multi-instance: pin these services to exactly one instance.
      # Background services start on every instance. With one instance that is correct and nothing
      # below needs setting. Run a second klacks-api and each of these runs twice: the same work, the
      # same external calls, the same writes to the same shared database. Switch them off on every
      # instance EXCEPT one - not "on the extra ones" - because with the flag off everywhere the work
      # stops happening at all. Syntax is a normal environment variable, section and property joined
      # by a double underscore:
      #   - BackgroundServices__GroupGeocoding=false
      # The ones that cost money or write shared data, most expensive first:
      #   GroupGeocoding              per group: a Nominatim call (third-party, shared rate limit), an
      #                               LLM classification call, and a coordinate write. Costs real money.
      #   KnowledgeIndexStartup       re-embeds the skill index after a seed change and writes it. Paid
      #                               API traffic wherever the remote embedding provider is configured.
      #   AgentTrigger                writes a dispatch row per recipient; dedupe and rate limiting are
      #                               in-process, so users get the proactive message once per instance.
      #   SkillRelationLearning       writes derived skill relations every 6 h.
      #   PendingNoteBroadcastCleanup soft-deletes expired broadcast notes hourly.
      #   ErpOrderImport              imports order files and writes orders.
      #   ScheduledTask               runs the user-defined cron tasks.
      #   AnswerGroundingSentinel     daily probe; writes findings and counters.
      # Not worth pinning: SkillCoverage only reads a doc file and writes one log line per week.
      # Already safe against double execution: ScheduledTask claims each occurrence with a conditional
      # UPDATE, ErpOrderImport claims each file with an atomic move (and its due time with a
      # conditional UPDATE). Left on everywhere they duplicate polling load, not work.
      # Inert by default: AnswerGroundingSentinel returns immediately unless
      # Assistant__AnswerGroundingMode is set to something other than Off.
      # Caution on GroupGeocoding: the enqueue interface stays active on an instance with the flag off,
      # and its bounded in-memory queue drops entries it can never drain. Those groups are picked up by
      # the startup sweep of the enabled instance, not lost permanently, but not resolved promptly.
      # The ONNX warm-up deliberately has NO flag: the inference sessions are per-process state, so
      # every instance wants its own warm pair and pinning would only leave the others cold. Its
      # opt-out for memory-capped hosts is KnowledgeIndex__WarmupEnabled=false.
      # Idle unloading of those sessions is switched off here. It only pays off below 3 GB: with the
      # 3584M limit further down both sessions fit permanently, while releasing them makes the next
      # question pay the reload (embedding 1949 ms, reranking 4315 ms, +1.3 GB of allocation churn).
      # The container is recreated nightly anyway, so nothing accumulates that an unload would clean
      # up. Zero is the documented off switch (KnowledgeIndexConstants.IdleUnloadDisabled); the
      # five-minute lower bound applies only to values above zero.
      - KnowledgeIndex__IdleUnloadMinutes=0
    volumes:
      - api-uploads:/app/Images
      - api-documents:/app/Documents
      - api-dataprotection:/app/DataProtection-Keys
      - api-models:/app/Cache/Models
      - api-erp-import:/app/ErpImport
      - ./regions:/app/regions:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - klacks_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s
    deploy:
      resources:
        limits:
          # 2560M was not enough. A cold reload of both ONNX sessions settles on a 2304 MB plateau
          # (1017 MB base + 1171 MB embedder + 116 MB reranker, production log 2026-09-12), and the
          # kernel OOM-killed the container at 2471 MB anon-rss. 3584M keeps real headroom above that
          # plateau. 4096M does not fit into the 8 GB host budget, which also carries postgres (2G),
          # the Whisper STT container (2560M, see whisper-stt below — an earlier version of this
          # comment claimed 4G and a "whisper" profile; neither was true, the service simply had no
          # definition in this file at all) and the small web containers below.
          memory: 3584M
          # Measured on production 2026-09-12 after v1.0.32: under cpus 1.5 the reranker pinned the
          # quota (docker stats 151%, 144 throttled periods / 7.15s throttled in two minutes, rerank
          # 4339-4860ms per 25 pairs); with cpus 3.0 throttling dropped to zero and rerank fell to
          # 2994-3163ms, assembly -30-35%, TTFT up to -33%. The host has 4 vCPUs; 3.0 is a ceiling,
          # not a reservation. Note that Environment.ProcessorCount follows the quota at start-up
          # (3 -> 3 ONNX intra-op threads).
          cpus: '3.0'

  # Out-of-process auto-update executor. Must outlive klacks-api (it recreates that container), so it
  # runs separately with the Docker socket + compose project dir mounted. Reads/writes the shared
  # update_history table. Phase 0.3 (done): runs from the public multi-arch image that
  # HeribertG/Klacks.Updater's own build-push.yml pushes to ghcr.io/heribertg/klacks-updater on every
  # push to main (:latest) and on v* tags — the server never builds it anymore. Pin a specific version
  # by setting KLACKS_UPDATER_TAG in .env (defaults to :latest).
  klacks-updater:
    # Started explicitly via the "updater" profile (docker compose --profile updater up -d) so a plain
    # `docker compose up` never touches it.
    profiles: ["updater"]
    image: ghcr.io/heribertg/klacks-updater:${KLACKS_UPDATER_TAG:-latest}
    container_name: klacks-updater
    restart: unless-stopped
    environment:
      - DOTNET_ENVIRONMENT=Production
      - Updater__ConnectionString=Host=postgres;Database=Klacks;Username=admin;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - Updater__HealthUrl=http://klacks-api:5000/internal/health/deep
      # Must equal the HOST path of this directory. The updater runs `docker compose up` against the
      # host's Docker socket, and the daemon resolves the compose file's relative bind mounts
      # (./regions, ./init-scripts) against the project dir as seen by the HOST — a container-only
      # path like /apps made Docker create empty /apps/regions on the host, so the API lost its
      # region profile and crash-looped after the 2026-09-10 auto-update.
      - Updater__ComposeProjectDir=/root/apps
      - Updater__ApiImageRepository=ghcr.io/heribertg/klacks-api
      - Updater__ApiServiceName=klacks-api
      - Updater__ApiTagEnvVar=KLACKS_API_TAG
      - Updater__UiImageRepository=ghcr.io/heribertg/klacks-ui
      - Updater__UiServiceName=klacks-ui
      - Updater__UiTagEnvVar=KLACKS_UI_TAG
      - Updater__PostgresContainer=klacks-postgres
      - Updater__SignaturePublicKey=${UPDATE_SIGNATURE_PUBLIC_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/apps:/root/apps
      - api-update-backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - klacks_network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  klacks-ui:
    image: ghcr.io/heribertg/klacks-ui:${KLACKS_UI_TAG:-latest}
    container_name: klacks-ui
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - klacks-api
    networks:
      - klacks_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  klacks-blazor:
    build: ./Klacks.Blazor
    container_name: klacks-blazor
    restart: unless-stopped
    expose:
      - "80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
    depends_on:
      - klacks-api
    networks:
      - klacks_network
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/80' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  klacks-marketing:
    build: ./Klacks.Marketing
    container_name: klacks-marketing
    restart: unless-stopped
    expose:
      - "80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
    networks:
      - klacks_network
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/80' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  klacks-marketplace:
    build: ./Klacks.Marketplace
    container_name: klacks-marketplace
    restart: unless-stopped
    expose:
      - "80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      # Marketplace is reachable both under klacks-software.ch/store/ (nginx strips nothing,
      # UsePathBase strips this prefix) and unchanged on the legacy :7553 port (no prefix there).
      - PathBase=/store
    volumes:
      - marketplace_data:/app/data
    networks:
      - klacks_network
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/80' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  devknowledge-postgres:
    image: pgvector/pgvector:pg16
    container_name: devknowledge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: devknowledge
      POSTGRES_USER: devknowledge
      POSTGRES_PASSWORD: ${DEVKNOWLEDGE_DB_PASSWORD:?DEVKNOWLEDGE_DB_PASSWORD must be set}
    expose:
      - "5432"
    volumes:
      - devknowledge_postgres_data:/var/lib/postgresql/data
    networks:
      - klacks_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devknowledge -d devknowledge"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  devknowledge-api:
    build:
      context: ./DevKnowledge
      dockerfile: backend/DevKnowledge.API/Dockerfile
    container_name: devknowledge-api
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Default=Host=devknowledge-postgres;Database=devknowledge;Username=devknowledge;Password=${DEVKNOWLEDGE_DB_PASSWORD:?DEVKNOWLEDGE_DB_PASSWORD must be set}
      - Anthropic__ApiKey=${ANTHROPIC_API_KEY}
      - OpenAI__ApiKey=${OPENAI_API_KEY:-}
      - KnowledgeBase__SourcePath=/data/knowledge
    volumes:
      - devknowledge_data:/data/knowledge
    depends_on:
      - devknowledge-postgres
    networks:
      - klacks_network
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  devknowledge-ui:
    build:
      context: ./DevKnowledge
      dockerfile: frontend/Dockerfile
    container_name: devknowledge-ui
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - devknowledge-api
    networks:
      - klacks_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # Static documentation site, served under /docs by the proxy from the build output in
  # ./klacks-docs-site. Restored into this file on 2026-09-12: the container has been running since
  # the 2026-07-11 revision (still on the server as docker-compose.yml.bak-whisper-threads) while its
  # service definition was dropped from a later edit, so it survived as an orphan — a
  # `docker compose up -d --remove-orphans` would have deleted it. Definition below matches the
  # running container (image, bind, network, healthcheck, limits) byte for byte.
  klacks-docs:
    image: nginx:alpine
    container_name: klacks-docs
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./klacks-docs-site:/usr/share/nginx/html:ro
    networks:
      - klacks_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/docs/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          # Unchanged, and it is the right size: nginx itself holds a few MB (docker stats 4.8 MiB
          # on 2026-09-12), the cgroup memory.peak of 110.8 MiB is almost entirely page cache for
          # the bind-mounted site, which the kernel reclaims under the cap instead of OOM-killing.
          memory: 128M
          cpus: '0.25'

  # Speech-to-text for the assistant's voice input (OpenAI-compatible /v1/audio/transcriptions).
  # Same orphan story as klacks-docs above, restored from the same 2026-07-11 revision. No profile:
  # that revision had none either, and the voice input depends on this service being up.
  whisper-stt:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: klacks-whisper-stt
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      # int8 on CPU. The two thread variables are NOT in the 2026-07-11 revision — they were added
      # to the live container afterwards and are read back from it here, so that a recreate does not
      # silently let a transcription take every core away from klacks-api on this 4 vCPU host.
      - WHISPER__COMPUTE_TYPE=int8
      - WHISPER__CPU_THREADS=2
      - OMP_NUM_THREADS=2
    volumes:
      # Resolves to apps_whisper_models in this project — the existing volume that already holds the
      # downloaded Systran/faster-whisper-small weights. Renaming it would silently mount an empty
      # volume and re-download the model from HuggingFace on the next transcription.
      - whisper_models:/home/ubuntu/.cache/huggingface/hub
    networks:
      - klacks_network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8000' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          # Lowered 4G -> 2560M on 2026-09-12 so the 8 GB host budget is honest next to the 3584M
          # of klacks-api above. What runs here is Systran/faster-whisper-small in int8 (~250 MB of
          # weights), one worker, and the model is unloaded again after 300 s idle. Measured on
          # production: 156 MiB resident (docker stats), cgroup memory.peak 307.9 MiB.
          # 🔴 That peak does NOT include a model load: this container has served no transcription
          # since its 2026-08-26 restart. 2560M is ~8x the measured peak and comfortably above a
          # plausible load-plus-inference peak, but the real peak is unmeasured. It is a ceiling,
          # not a reservation — the container idles at ~156 MiB.
          memory: 2560M
          cpus: '2.0'

  # Renews the Let's Encrypt certificate every 12h. Renewal only runs when
  # the cert is within 30 days of expiry; otherwise certbot exits as a no-op.
  # After a successful renewal, sends SIGHUP to klacks-proxy via the Docker
  # Engine API (mounted socket) so nginx picks up the new cert without restart.
  certbot-renew:
    image: certbot/certbot
    container_name: klacks-certbot-renew
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apk add --no-cache curl >/dev/null 2>&1 || true
        trap exit TERM
        while :; do
          certbot renew --webroot --webroot-path=/var/www/certbot --quiet \
            --deploy-hook 'curl -sS --unix-socket /var/run/docker.sock -X POST http://localhost/containers/klacks-proxy/kill?signal=HUP'
          sleep 12h & wait $${!}
        done
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'

  nginx-proxy:
    image: nginx:alpine
    container_name: klacks-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "3000:3000"
      - "5000:5000"
      - "5443:5443"
      - "7443:7443"
      - "5553:5553"
      - "7553:7553"
      - "7643:7643"
      - "8443:8443"
    environment:
      - SERVER_IP=${SERVER_IP:-157.180.42.127}
    command: /bin/sh -c "envsubst '$$SERVER_IP' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && nginx -g 'daemon off;'"
    volumes:
      - ./Klacks.Api/deploy/nginx-proxy/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./Klacks.Api/deploy/nginx-proxy/certs:/etc/nginx/certs:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - klacks-api
      - klacks-ui
      - klacks-blazor
      - klacks-marketing
      - pgadmin
      - devknowledge-ui
    networks:
      - klacks_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

networks:
  klacks_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  marketplace_data:
    driver: local
  devknowledge_postgres_data:
    driver: local
  devknowledge_data:
    driver: local
  api-uploads:
    driver: local
  api-documents:
    driver: local
  api-dataprotection:
    driver: local
  api-models:
    driver: local
  api-erp-import:
    driver: local
  api-update-backups:
    driver: local
  letsencrypt:
    driver: local
  certbot-webroot:
    driver: local
  # Existing volume on the server (apps_whisper_models); holds the downloaded Whisper weights.
  whisper_models:
    driver: local
