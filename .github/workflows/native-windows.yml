# .github/workflows/native-windows.yml for Klacks.Api
#
# Reusable build, install gate and (optionally) publish of the native Windows installation
# (docs/plans/native-a2-release-package-2026-10-13.md). Every mode builds the signed win-x64 bundle and the office-PC
# package klacks-office-pc-win-x64.zip once, installs exactly that package through Installieren.cmd on clean runners
# (service mode, Windows PowerShell 5.1, path with space and umlaut; x64 with and without region, and Windows 11 on
# ARM64 where the x64 package runs through emulation) and checks start, UI, login, setup status, restart and uninstall.
#   gate             stops after the checks
#   release-dry-run  additionally rehearses the publish on draft releases (tags native-dryrun-<run id> and
#                    office-pc-dryrun-<run id>, deleted after)
#   release          publishes to the stable release v<version>: bundle + package, then adds artifacts.native to
#                    stable.json - only after every install is green and every check passed (fail-closed). Finally the
#                    package replaces the asset of the rolling prerelease office-pc, the stable download link of the
#                    marketplace: it always serves the last green package, also while a newer release is still
#                    building or after a failed native run. A last, read-only job (verify-office-pc) turns the run
#                    red when office-pc does not serve this release's ZIP and setup EXE (deploy/native/verify-rolling-download.sh).
# Callers: native-windows-gate.yml (workflow_dispatch) and native-release.yml (v* tags). Callers pass secrets: inherit.

name: Native Windows (reusable)

on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      ui_version:
        type: string
        required: false
        default: ''

env:
  DOTNET_VERSION: '10.0.x'
  POSTGRES_BINARIES_URL: 'https://get.enterprisedb.com/postgresql/postgresql-17.4-1-windows-x64-binaries.zip'
  PGVECTOR_TAG: 'v0.8.1'
  VC_REDIST_URL: 'https://aka.ms/vs/17/release/vc_redist.x64.exe'
  HTTP_PORT: '5180'
  SEED_ADMIN_EMAIL: 'admin@test.com'
  SEED_ADMIN_PASSWORD: 'P@ssw0rt1'
  RELEASE_DOWNLOAD_BASE: 'https://github.com/HeribertG/Klacks.Api/releases/download'
  PACKAGE_FILE: 'klacks-office-pc-win-x64.zip'
  INSTALLER_FILE: 'Klacks-Setup-win-x64.exe'
  ROLLING_INSTALLER_STAGED_FILE: 'Klacks-Setup-win-x64.next.exe'
  ROLLING_INSTALLER_PREVIOUS_FILE: 'Klacks-Setup-win-x64.previous.exe'
  ROLLING_TAG: 'office-pc'
  ROLLING_STAGED_FILE: 'klacks-office-pc-win-x64.next.zip'
  ROLLING_PREVIOUS_FILE: 'klacks-office-pc-win-x64.previous.zip'

jobs:
  ui:
    name: ui (extract from ghcr image)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout Klacks.Api (tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          MODE: ${{ inputs.mode }}
          UI_VERSION: ${{ inputs.ui_version }}
        run: |
          set -euo pipefail
          case "$MODE" in gate|release-dry-run|release) ;; *) echo "::error::Unknown mode '$MODE'"; exit 1 ;; esac
          if [ "$MODE" = release ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$UI_VERSION"
            if [ -z "$version" ]; then
              version=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 | sed 's/^v//')
            fi
          fi
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::Invalid version '$version'"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version (mode $MODE)"

      - name: Wait for ghcr.io/heribertg/klacks-ui
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The Klacks.Ui tag build runs in parallel to this one (scripts/release.ps1 tags both).
          for attempt in $(seq 1 45); do
            if docker manifest inspect "ghcr.io/heribertg/klacks-ui:${VERSION}" >/dev/null 2>&1; then exit 0; fi
            echo "Waiting for klacks-ui:${VERSION} (attempt $attempt/45)"; sleep 60
          done
          echo "::error::klacks-ui:${VERSION} is not on ghcr after 45 minutes"; exit 1

      - name: Extract UI from ghcr.io/heribertg/klacks-ui
        run: |
          image="ghcr.io/heribertg/klacks-ui:${{ steps.version.outputs.version }}"
          docker pull "$image"
          id=$(docker create "$image")
          docker cp "$id:/usr/share/nginx/html" ./ui
          docker rm "$id"
          test -f ui/index.html
          test -f ui/assets/i18n/de.json

      - name: Upload UI
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui
          retention-days: 3

  package:
    name: package (win-x64)
    needs: ui
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.ui.outputs.version }}
    steps:
      - name: Checkout Klacks.Api
        uses: actions/checkout@v4
        with:
          path: Klacks.Api

      - name: Checkout Klacks.Plugin.Contracts
        uses: actions/checkout@v4
        with:
          repository: HeribertG/Klacks.Plugin.Contracts
          path: Klacks.Plugin.Contracts
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Checkout Klacks.Plugin.Messaging
        uses: actions/checkout@v4
        with:
          repository: HeribertG/Klacks.Plugin.Messaging
          path: Klacks.Plugin.Messaging
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Checkout Klacks.Docs
        uses: actions/checkout@v4
        with:
          repository: HeribertG/Klacks.Docs
          path: Klacks.Docs
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Checkout Klacks.Api.SourceGenerators
        uses: actions/checkout@v4
        with:
          repository: HeribertG/Klacks.Api.SourceGenerators
          path: Klacks.Api.SourceGenerators
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Checkout Klacks.ScheduleOptimizer
        uses: actions/checkout@v4
        with:
          repository: HeribertG/Klacks.ScheduleOptimizer
          path: Klacks.ScheduleOptimizer

      - name: Checkout Klacks.ScheduleRecovery
        uses: actions/checkout@v4
        with:
          repository: HeribertG/Klacks.ScheduleRecovery
          path: Klacks.ScheduleRecovery

      - name: Checkout Klacks.Updater
        uses: actions/checkout@v4
        with:
          repository: HeribertG/Klacks.Updater
          path: Klacks.Updater

      - name: Read pinned Klacks.Stt version
        id: sttver
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < Klacks.Api/deploy/stt-version)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "deploy/stt-version must hold X.Y.Z, found '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout Klacks.Stt
        uses: actions/checkout@v4
        with:
          repository: HeribertG/Klacks.Stt
          ref: v${{ steps.sttver.outputs.version }}
          path: Klacks.Stt

      - name: Checkout pgvector
        uses: actions/checkout@v4
        with:
          repository: pgvector/pgvector
          ref: ${{ env.PGVECTOR_TAG }}
          path: pgvector

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download UI
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui

      - name: Signing key
        shell: pwsh
        env:
          PRIV_B64: ${{ secrets.UPDATE_SIGNATURE_PRIVATE_KEY_B64 }}
        run: |
          if (-not $env:PRIV_B64) { throw 'UPDATE_SIGNATURE_PRIVATE_KEY_B64 secret is not set.' }
          $private = Join-Path $env:RUNNER_TEMP 'update_priv.pem'
          [IO.File]::WriteAllBytes($private, [Convert]::FromBase64String($env:PRIV_B64))
          $rsa = [Security.Cryptography.RSA]::Create()
          $rsa.ImportFromPem((Get-Content -Raw $private))
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'update-public-key.pem'), $rsa.ExportSubjectPublicKeyInfoPem())
          $rsa.Dispose()

      - name: Build signed win-x64 bundle
        shell: pwsh
        env:
          BUILD_KEY: ${{ inputs.mode == 'release' && github.sha || format('gate-{0}', github.run_id) }}
        run: |
          try {
            & Klacks.Api/deploy/native/build-native-bundle.ps1 -Rid win-x64 -Version $env:VERSION `
              -UiDist ui -OutputDirectory bundle -BundleBaseUrl "$env:RELEASE_DOWNLOAD_BASE/v$env:VERSION" `
              -UpdaterProject Klacks.Updater/Klacks.Updater/Klacks.Updater.csproj `
              -SttProject Klacks.Stt/Klacks.Stt/Klacks.Stt.csproj -BuildKey $env:BUILD_KEY `
              -SigningKeyPath (Join-Path $env:RUNNER_TEMP 'update_priv.pem')
          }
          finally {
            Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'update_priv.pem')
          }

      - name: Download PostgreSQL binaries
        shell: pwsh
        run: |
          Invoke-WebRequest -UseBasicParsing -Uri $env:POSTGRES_BINARIES_URL -OutFile postgresql.zip
          Expand-Archive postgresql.zip -DestinationPath postgres-extract
          Move-Item postgres-extract/pgsql postgresql

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build pgvector
        shell: cmd
        run: |
          set "PGROOT=%GITHUB_WORKSPACE%\postgresql"
          cd pgvector
          nmake /NOLOGO /F Makefile.win || exit /b 1
          nmake /NOLOGO /F Makefile.win install || exit /b 1
          if not exist "%PGROOT%\lib\vector.dll" exit /b 1

      - name: Download Visual C++ redistributable
        shell: pwsh
        run: Invoke-WebRequest -UseBasicParsing -Uri $env:VC_REDIST_URL -OutFile vc_redist.x64.exe

      - name: Build office-PC package
        shell: pwsh
        run: |
          & Klacks.Api/deploy/native/windows/New-KlacksOfficePackage.ps1 `
            -BundleZip "bundle/klacks-$env:VERSION-win-x64.zip" -BundleEntry "bundle/klacks-$env:VERSION-win-x64.json" `
            -Version $env:VERSION -PostgresDirectory postgresql -VcRedistPath vc_redist.x64.exe `
            -PublicKeyPath (Join-Path $env:RUNNER_TEMP 'update-public-key.pem') -OutputDirectory package

      # Builds Klacks-Setup-win-x64.exe from the same inputs into its own folder (the ZIP it also writes there is
      # discarded). Fail-soft: a failure or timeout here leaves the ZIP release intact; the EXE is then simply not
      # published (the installer job and the publish step below look for the artifact).
      - name: Build setup installer (Inno Setup)
        continue-on-error: true
        timeout-minutes: 25
        shell: pwsh
        run: |
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $iscc -and -not (Test-Path (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'))) {
            choco install innosetup --version 6.7.3 --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed with $LASTEXITCODE." }
          }
          & Klacks.Api/deploy/native/windows/New-KlacksOfficePackage.ps1 `
            -BundleZip "bundle/klacks-$env:VERSION-win-x64.zip" -BundleEntry "bundle/klacks-$env:VERSION-win-x64.json" `
            -Version $env:VERSION -PostgresDirectory postgresql -VcRedistPath vc_redist.x64.exe `
            -PublicKeyPath (Join-Path $env:RUNNER_TEMP 'update-public-key.pem') -OutputDirectory installer-out -BuildInstaller

      - name: Runtime identifier (proxy check)
        shell: pwsh
        run: |
          # Proxy for the API's InstallationIdentityProvider: same .NET runtime family on the same runner.
          $rid = [System.Runtime.InteropServices.RuntimeInformation]::RuntimeIdentifier
          Write-Host "RuntimeIdentifier: $rid"
          if ($rid -ne 'win-x64') { throw "RuntimeIdentifier is '$rid', the manifest entry says win-x64." }

      - name: Upload release payload
        uses: actions/upload-artifact@v4
        with:
          name: native-release-payload
          path: |
            bundle/klacks-${{ env.VERSION }}-win-x64.zip
            bundle/klacks-${{ env.VERSION }}-win-x64.json
            package/${{ env.PACKAGE_FILE }}
          retention-days: 14

      - name: Upload setup installer
        uses: actions/upload-artifact@v4
        with:
          name: native-installer
          path: installer-out/${{ env.INSTALLER_FILE }}
          if-no-files-found: warn
          retention-days: 14

  install:
    name: install (${{ matrix.label }})
    needs: [ui, package]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64
            runner: windows-latest
            region: ''
          - label: x64-ch
            runner: windows-latest
            region: 'ch'
          - label: arm64-emulation
            runner: windows-11-arm
            region: ''
    env:
      VERSION: ${{ needs.ui.outputs.version }}
    steps:
      - name: Checkout Klacks.Api
        uses: actions/checkout@v4
        with:
          path: Klacks.Api

      - name: Download release payload
        uses: actions/download-artifact@v4
        with:
          name: native-release-payload
          path: payload

      - name: Install Klacks from the package (Installieren.cmd, Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "OS architecture: $env:PROCESSOR_ARCHITECTURE / $((Get-CimInstance Win32_OperatingSystem).OSArchitecture)"
          # A folder name with a space and an umlaut, as on a German USB stick; [char] keeps the script ASCII-only.
          $target = Join-Path $env:RUNNER_TEMP ('Test Ordner ' + [char]0x00C4)
          Expand-Archive -Path "payload\package\$env:PACKAGE_FILE" -DestinationPath $target
          $env:KLACKS_NO_PAUSE = '1'
          # Start-Process runs the .cmd the way a double-click does (cmd /c with the quoted path).
          $launch = @{ FilePath = (Join-Path $target 'Installieren.cmd'); Wait = $true; PassThru = $true; NoNewWindow = $true }
          if ('${{ matrix.region }}') { $launch.ArgumentList = @('-Region', '${{ matrix.region }}') }
          $exitCode = (Start-Process @launch).ExitCode
          Get-ChildItem $target -Filter 'Klacks-Installationsbericht-*.txt' | ForEach-Object { Get-Content $_.FullName }
          if ($exitCode -ne 0) { throw "Installieren.cmd exited with $exitCode." }
          $config = Get-Content -Raw "$env:ProgramData\Klacks\config\klacks.native.json" | ConvertFrom-Json
          if (-not $config.Update.SignaturePublicKey) { throw 'The installation has no update signature key.' }
          $vc = 'HKLM:\SOFTWARE\Microsoft\VisualStudio\14.0\VC\Runtimes\X64', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\VisualStudio\14.0\VC\Runtimes\x64' |
            ForEach-Object { Get-ItemProperty -Path $_ -ErrorAction SilentlyContinue } | Where-Object { $_.Installed -eq 1 }
          if (-not $vc) { throw 'The Visual C++ runtime is not registered after the installation.' }

      - name: Service binaries are x64
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # The manifest entry and the updater's artifact choice say win-x64; on ARM64 the services must still run the
          # x64 binaries (through emulation), so the PE machine type of every registered service binary is checked.
          foreach ($name in 'KlacksPostgres', 'Klacks', 'KlacksUpdater', 'KlacksStt') {
            $pathName = (Get-CimInstance Win32_Service -Filter "Name='$name'").PathName
            $exe = if ($pathName -match '^"([^"]+)"') { $Matches[1] } else { ($pathName -split ' ')[0] }
            $header = New-Object byte[] 4096
            $stream = [IO.File]::OpenRead($exe)
            try { [void]$stream.Read($header, 0, $header.Length) } finally { $stream.Dispose() }
            $machine = [BitConverter]::ToUInt16($header, [BitConverter]::ToInt32($header, 0x3C) + 4)
            Write-Host ('{0}: {1} machine 0x{2:X4}' -f $name, $exe, $machine)
            if ($machine -ne 0x8664) { throw ('{0} runs {1}, which is not an x64 binary.' -f $name, $exe) }
          }

      - name: Check services, UI, login and setup status
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = "http://127.0.0.1:$env:HTTP_PORT"
          function Wait-Health($seconds) {
            $deadline = (Get-Date).AddSeconds($seconds)
            while ((Get-Date) -lt $deadline) {
              try { if ((Invoke-WebRequest -UseBasicParsing "$base/internal/health/deep" -TimeoutSec 10).StatusCode -eq 200) { return } } catch { }
              Start-Sleep -Seconds 5
            }
            throw "Klacks is not healthy after $seconds s."
          }
          Wait-Health 1800
          foreach ($name in 'KlacksPostgres', 'Klacks', 'KlacksUpdater') {
            $status = (Get-Service -Name $name).Status
            Write-Host "$name : $status"
            if ($status -ne 'Running') { throw "Service $name is $status." }
          }
          # The speech recognition service is registered but stays off until the Parakeet engine is installed.
          $stt = Get-Service -Name KlacksStt -ErrorAction SilentlyContinue
          if (-not $stt) { throw 'Service KlacksStt is not registered.' }
          if ($stt.StartType -ne 'Disabled') { throw "Service KlacksStt start type is $($stt.StartType), expected Disabled." }
          if ($stt.Status -ne 'Stopped') { throw "Service KlacksStt is $($stt.Status), expected Stopped." }
          $sttAccount = (Get-CimInstance Win32_Service -Filter "Name='KlacksStt'").StartName
          if ($sttAccount -ne 'NT SERVICE\KlacksStt') { throw "Service KlacksStt runs as $sttAccount, expected NT SERVICE\KlacksStt." }
          $users = New-Object System.Security.Principal.SecurityIdentifier('S-1-5-32-545')
          foreach ($path in "$env:ProgramData\Klacks", "$env:ProgramData\Klacks\pgdata", "$env:ProgramData\Klacks\backups") {
            $open = (Get-Acl $path).Access | Where-Object { $_.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]) -eq $users }
            if ($open) { throw "$path is accessible for all users." }
          }
          $index = Invoke-WebRequest -UseBasicParsing "$base/"
          if ($index.Content -notmatch '<app-root') { throw 'The UI index is not served.' }
          # Raw text on purpose: de.json holds keys that differ only in case ("delete"/"DELETE"), which PowerShell's
          # JSON conversion rejects, so Invoke-RestMethod silently returns a plain string.
          $i18n = (Invoke-WebRequest -UseBasicParsing "$base/assets/i18n/de.json").Content
          if ($i18n -notmatch '"setup\.passwordRules"\s*:') { throw 'assets/i18n/de.json is missing or outdated.' }
          $login = Invoke-RestMethod -Method Post -ContentType 'application/json' -Uri "$base/api/backend/Accounts/LoginUser" `
            -Body (@{ email = $env:SEED_ADMIN_EMAIL; password = $env:SEED_ADMIN_PASSWORD } | ConvertTo-Json)
          if (-not $login.token) { throw 'Login with the seeded admin returned no token.' }
          $status = Invoke-RestMethod -Uri "$base/api/backend/Setup/Status" -Headers @{ Authorization = "Bearer $($login.token)" }
          if (-not $status.requiresOwnAdmin) { throw 'Setup/Status does not require the own admin account.' }
          if ($status.passwordPolicy.requiredLength -lt 8) { throw 'Setup/Status publishes no password policy.' }
          Write-Host 'Login, UI and setup status OK.'

      - name: Restart Klacks
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $service = Get-Service -Name Klacks
          $service.Stop()
          $service.WaitForStatus('Stopped', [TimeSpan]::FromMinutes(2))
          $exitCode = (Get-CimInstance Win32_Service -Filter "Name='Klacks'").ExitCode
          if ($exitCode -ne 0) { throw "A requested stop ended with exit code $exitCode." }
          $service.Start()
          $deadline = (Get-Date).AddMinutes(15)
          while ((Get-Date) -lt $deadline) {
            try { if ((Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$env:HTTP_PORT/internal/health/deep" -TimeoutSec 10).StatusCode -eq 200) { Write-Host 'Healthy after restart.'; exit 0 } } catch { }
            Start-Sleep -Seconds 5
          }
          throw 'Klacks is not healthy after a restart.'

      - name: Diagnostics report
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path diagnostics | Out-Null
          & .\Klacks.Api\deploy\native\windows\Get-KlacksDiagnostics.ps1 -ReportDirectory (Resolve-Path diagnostics).Path
          Copy-Item -Recurse -ErrorAction SilentlyContinue "$env:ProgramData\Klacks\logs" diagnostics\logs

      - name: Uninstall
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\Klacks.Api\deploy\native\windows\Uninstall-Klacks.ps1 -RemoveData
          if ($LASTEXITCODE -ne 0) { throw "Uninstall-Klacks.ps1 exited with $LASTEXITCODE." }
          foreach ($name in 'KlacksPostgres', 'Klacks', 'KlacksUpdater', 'KlacksStt') {
            if (Get-Service -Name $name -ErrorAction SilentlyContinue) { throw "Service $name is still registered." }
          }
          if (Test-Path "$env:ProgramData\Klacks") { throw 'The data directory is still present after -RemoveData.' }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.label }}
          path: diagnostics
          retention-days: 14

  # Installs the Inno Setup EXE silently on clean runners and checks services, health, login and uninstall. Publish
  # releases the EXE (next to the ZIP) only when every leg is green; a red leg never blocks the ZIP release.
  installer:
    name: installer (${{ matrix.label }})
    needs: [ui, package]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64
            runner: windows-latest
            region: ''
          - label: x64-ch
            runner: windows-latest
            region: 'CH'
          - label: arm64-emulation
            runner: windows-11-arm
            region: ''
    env:
      VERSION: ${{ needs.ui.outputs.version }}
    steps:
      - name: Download setup installer
        uses: actions/download-artifact@v4
        with:
          name: native-installer
          path: payload

      - name: Install Klacks silently (Setup.exe)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "payload\$env:INSTALLER_FILE"
          if (-not (Test-Path $exe)) { throw "$env:INSTALLER_FILE is missing (installer build failed?)." }
          $log = Join-Path $env:RUNNER_TEMP 'setup.log'
          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$log")
          if ('${{ matrix.region }}') { $arguments += '/REGION=${{ matrix.region }}' }
          $exitCode = (Start-Process -FilePath (Resolve-Path $exe).Path -ArgumentList $arguments -Wait -PassThru).ExitCode
          Get-ChildItem "$env:ProgramData\Klacks\logs" -Filter 'Installationsbericht-*.txt' -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName }
          if ($exitCode -ne 0) { Get-Content $log -Tail 40; throw "Setup exited with $exitCode." }
          $config = Get-Content -Raw "$env:ProgramData\Klacks\config\klacks.native.json" | ConvertFrom-Json
          if (-not $config.Update.SignaturePublicKey) { throw 'The installation has no update signature key.' }
          if (-not (Test-Path "$env:ProgramFiles\Klacks Setup\unins000.exe")) { throw 'The uninstaller is missing.' }
          $entry = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object DisplayName -eq 'Klacks'
          if (-not $entry) { throw 'Klacks is not listed under Apps & Features.' }

      - name: Check services and health
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = "http://127.0.0.1:$env:HTTP_PORT"
          $deadline = (Get-Date).AddMinutes(30)
          $healthy = $false
          while ((Get-Date) -lt $deadline -and -not $healthy) {
            try { $healthy = (Invoke-WebRequest -UseBasicParsing "$base/internal/health/deep" -TimeoutSec 10).StatusCode -eq 200 } catch { }
            if (-not $healthy) { Start-Sleep -Seconds 5 }
          }
          if (-not $healthy) { throw 'Klacks is not healthy.' }
          foreach ($name in 'KlacksPostgres', 'Klacks', 'KlacksUpdater') {
            $status = (Get-Service -Name $name).Status
            if ($status -ne 'Running') { throw "Service $name is $status." }
          }
          $stt = Get-Service -Name KlacksStt -ErrorAction SilentlyContinue
          if (-not $stt) { throw 'Service KlacksStt is not registered.' }
          if ($stt.StartType -ne 'Disabled') { throw "Service KlacksStt start type is $($stt.StartType), expected Disabled." }
          if ($stt.Status -ne 'Stopped') { throw "Service KlacksStt is $($stt.Status), expected Stopped." }
          $login = Invoke-RestMethod -Method Post -ContentType 'application/json' -Uri "$base/api/backend/Accounts/LoginUser" `
            -Body (@{ email = $env:SEED_ADMIN_EMAIL; password = $env:SEED_ADMIN_PASSWORD } | ConvertTo-Json)
          if (-not $login.token) { throw 'Login with the seeded admin returned no token.' }
          Write-Host 'Services, health and login OK.'

      - name: Uninstall silently (unins000.exe)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $uninstaller = "$env:ProgramFiles\Klacks Setup\unins000.exe"
          $log = Join-Path $env:RUNNER_TEMP 'uninstall.log'
          $exitCode = (Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/REMOVEDATA', "/LOG=$log" -Wait -PassThru).ExitCode
          if ($exitCode -ne 0) {
            Get-ChildItem "$env:ProgramFiles\Klacks Setup" -Filter 'Deinstallationsbericht-*.txt' -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName }
            Get-Content $log -Tail 40 -ErrorAction SilentlyContinue
            throw "Uninstaller exited with $exitCode."
          }
          # The uninstall entry is removed before the uninstaller reports its exit code; only the setup folder with
          # unins000.exe is deleted afterwards by the uninstaller's temporary copy, so it is not checked here.
          $entry = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object DisplayName -eq 'Klacks'
          if ($entry) { throw 'Klacks is still listed under Apps & Features after the uninstall.' }
          foreach ($name in 'KlacksPostgres', 'Klacks', 'KlacksUpdater', 'KlacksStt') {
            if (Get-Service -Name $name -ErrorAction SilentlyContinue) { throw "Service $name is still registered." }
          }
          if (Test-Path "$env:ProgramData\Klacks") { throw 'The data directory is still present after /REMOVEDATA.' }
          if (Test-Path "$env:ProgramFiles\Klacks") { throw 'The program directory is still present.' }

  publish:
    name: publish (${{ inputs.mode }})
    needs: [ui, package, install, installer]
    # always(): a red installer leg must not stop the ZIP release; the ZIP prerequisites are checked explicitly.
    if: ${{ always() && inputs.mode != 'gate' && needs.ui.result == 'success' && needs.package.result == 'success' && needs.install.result == 'success' }}
    runs-on: ubuntu-latest
    # deploy.yml needs about 77 min from the tag to stable.json (v1.0.41, v1.0.42); the wait below allows 150 min.
    timeout-minutes: 200
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.ui.outputs.version }}
      MODE: ${{ inputs.mode }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Klacks.Api
        uses: actions/checkout@v4

      - name: Download release payload
        uses: actions/download-artifact@v4
        with:
          name: native-release-payload
          path: payload

      - name: Public key
        env:
          PRIV_B64: ${{ secrets.UPDATE_SIGNATURE_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          echo "$PRIV_B64" | base64 -d > /tmp/update_priv.pem
          openssl rsa -in /tmp/update_priv.pem -pubout > "$RUNNER_TEMP/update-public-key.pem"
          rm -f /tmp/update_priv.pem

      - name: Target release
        id: target
        run: |
          set -euo pipefail
          if [ "$MODE" = release ]; then
            tag="v${VERSION}"
            # deploy.yml creates the release and uploads stable.json after the Docker build; never create it here.
            for attempt in $(seq 1 150); do
              if gh release download "$tag" -R "$GITHUB_REPOSITORY" -p stable.json -O current-stable.json --clobber 2>/dev/null \
                 && [ "$(jq -r .latestVersion current-stable.json)" = "$VERSION" ]; then
                break
              fi
              if [ "$attempt" -eq 150 ]; then echo "::error::Release $tag has no stable.json for $VERSION after 150 minutes"; exit 1; fi
              echo "Waiting for $tag/stable.json (attempt $attempt/150)"; sleep 60
            done
          else
            tag="native-dryrun-${GITHUB_RUN_ID}"
            curl -fsSL "https://github.com/HeribertG/Klacks.Api/releases/latest/download/stable.json" -o current-stable.json
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "native dry run ${GITHUB_RUN_ID}" --notes "Rehearsal of the native publish; deleted at the end of the run."
            mkdir -p dryrun && cp current-stable.json dryrun/stable.json
            gh release upload "$tag" dryrun/stable.json -R "$GITHUB_REPOSITORY" --clobber
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload bundle and package
        run: |
          set -euo pipefail
          gh release upload "${{ steps.target.outputs.tag }}" -R "$GITHUB_REPOSITORY" --clobber \
            "payload/bundle/klacks-${VERSION}-win-x64.zip" "payload/package/${PACKAGE_FILE}"

      - name: Download back and compare
        run: |
          set -euo pipefail
          mkdir -p back
          if [ "$MODE" = release ]; then
            curl -fsSL "${RELEASE_DOWNLOAD_BASE}/v${VERSION}/klacks-${VERSION}-win-x64.zip" -o back/bundle.zip
            curl -fsSL "${RELEASE_DOWNLOAD_BASE}/v${VERSION}/${PACKAGE_FILE}" -o back/package.zip
          else
            gh release download "${{ steps.target.outputs.tag }}" -R "$GITHUB_REPOSITORY" -p "klacks-${VERSION}-win-x64.zip" -O back/bundle.zip
            gh release download "${{ steps.target.outputs.tag }}" -R "$GITHUB_REPOSITORY" -p "${PACKAGE_FILE}" -O back/package.zip
          fi
          cmp back/bundle.zip "payload/bundle/klacks-${VERSION}-win-x64.zip"
          cmp back/package.zip "payload/package/${PACKAGE_FILE}"
          unzip -p back/package.zip "klacks-${VERSION}-win-x64.zip" | cmp - back/bundle.zip

      - name: Merge native entry into stable.json
        shell: pwsh
        run: |
          & ./deploy/native/Publish-NativeManifest.ps1 -ManifestPath current-stable.json `
            -EntryPath "payload/bundle/klacks-$env:VERSION-win-x64.json" -BundlePath back/bundle.zip `
            -PublicKeyPath (Join-Path $env:RUNNER_TEMP 'update-public-key.pem') -Version $env:VERSION `
            -ExpectedBundleUrl "$env:RELEASE_DOWNLOAD_BASE/v$env:VERSION/klacks-$env:VERSION-win-x64.zip" `
            -OutputPath merged-stable.json
          Get-Content merged-stable.json

      - name: Publish stable.json
        run: |
          set -euo pipefail
          tag="${{ steps.target.outputs.tag }}"
          mkdir -p out && cp merged-stable.json out/stable.json
          gh release upload "$tag" out/stable.json -R "$GITHUB_REPOSITORY" --clobber
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p stable.json -O published-stable.json --clobber
          cmp published-stable.json merged-stable.json

      - name: Rolling office-PC download
        id: rolling
        run: |
          set -euo pipefail
          if [ "$MODE" = release ]; then rolling="$ROLLING_TAG"; else rolling="${ROLLING_TAG}-dryrun-${GITHUB_RUN_ID}"; fi
          echo "tag=$rolling" >> "$GITHUB_OUTPUT"
          if ! gh release view "$rolling" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            draft=()
            [ "$MODE" = release ] || draft=(--draft)
            # A prerelease that is never "latest": releases/latest/download/stable.json stays the Docker update path.
            gh release create "$rolling" -R "$GITHUB_REPOSITORY" "${draft[@]}" --prerelease --latest=false \
              --target "$GITHUB_SHA" --title "Office PC package" \
              --notes "Always the last office-PC package that passed the native install gate; replaced by every stable release."
          fi
          mkdir -p rolling
          gh release view "$rolling" -R "$GITHUB_REPOSITORY" --json name > rolling/release.json
          current=$(jq -r '.name' rolling/release.json | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+$' || true)
          if [ -n "$current" ] && [ "$current" != "$VERSION" ] \
             && [ "$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -1)" = "$current" ]; then
            echo "::notice::${rolling} already serves ${current}, newer than ${VERSION}; left unchanged."
            exit 0
          fi
          if [ "$MODE" != release ]; then
            # The dry-run draft starts empty; a placeholder lets the rehearsal run the same replace path as a release.
            echo placeholder > "rolling/${PACKAGE_FILE}"
            gh release upload "$rolling" "rolling/${PACKAGE_FILE}" -R "$GITHUB_REPOSITORY" --clobber
          fi
          cp "payload/package/${PACKAGE_FILE}" "rolling/${ROLLING_STAGED_FILE}"
          gh release upload "$rolling" "rolling/${ROLLING_STAGED_FILE}" -R "$GITHUB_REPOSITORY" --clobber
          # Upload under a staging name first, then swap by renaming: the public file is missing for one API call, not
          # for an upload, and a failed swap restores the previous package. A leftover .previous.zip is deleted only
          # while a public package exists; without one it is the last good package and is restored.
          asset_url() { jq -r --arg n "$1" '.assets[] | select(.name == $n) | .apiUrl' rolling/assets.json; }
          rename_asset() {
            for attempt in 1 2 3; do
              if gh api -X PATCH "$1" -f name="$2" > /dev/null; then return 0; fi
              sleep 10
            done
            return 1
          }
          gh release view "$rolling" -R "$GITHUB_REPOSITORY" --json assets > rolling/assets.json
          old=$(asset_url "$PACKAGE_FILE")
          leftover=$(asset_url "$ROLLING_PREVIOUS_FILE")
          if [ -n "$leftover" ] && [ -z "$old" ]; then
            # An earlier run died between moving the package aside and the swap: its previous file is the last good one.
            rename_asset "$leftover" "$PACKAGE_FILE" || { echo "::error::Restoring ${ROLLING_PREVIOUS_FILE} on ${rolling} failed"; exit 1; }
            old="$leftover"
          elif [ -n "$leftover" ]; then
            gh api -X DELETE "$leftover"
          fi
          staged=$(asset_url "$ROLLING_STAGED_FILE")
          [ -n "$staged" ] || { echo "::error::Staged asset ${ROLLING_STAGED_FILE} is missing on ${rolling}"; exit 1; }
          if [ -n "$old" ]; then
            rename_asset "$old" "$ROLLING_PREVIOUS_FILE" || { echo "::error::Moving the previous package aside on ${rolling} failed"; exit 1; }
          fi
          if ! rename_asset "$staged" "$PACKAGE_FILE"; then
            if [ -n "$old" ]; then rename_asset "$old" "$PACKAGE_FILE" || echo "::error::Restoring the previous package on ${rolling} failed"; fi
            echo "::error::Renaming the staged package on ${rolling} failed"
            exit 1
          fi
          # The previous package stays as .previous.zip until the next run: GitHub caches the redirect of the public
          # download URL for a few minutes, and a cached redirect must not point at a deleted asset.
          gh release edit "$rolling" -R "$GITHUB_REPOSITORY" --title "Office PC package ${VERSION}" > /dev/null
          gh release download "$rolling" -R "$GITHUB_REPOSITORY" -p "$PACKAGE_FILE" -O rolling/back.zip --clobber
          cmp rolling/back.zip "payload/package/${PACKAGE_FILE}"
          if [ "$MODE" = release ]; then
            public=""
            for attempt in 1 2 3 4 5; do
              if curl -fsSL "${RELEASE_DOWNLOAD_BASE}/${rolling}/${PACKAGE_FILE}?run=${GITHUB_RUN_ID}-${attempt}" -o rolling/public.zip \
                 && cmp -s rolling/public.zip "payload/package/${PACKAGE_FILE}"; then public=ok; break; fi
              sleep 30
            done
            [ "$public" = ok ] || echo "::warning::The public URL of ${rolling} does not serve ${VERSION} yet (GitHub cache); the API copy is correct."
          fi
          echo "Rolling download ${rolling}/${PACKAGE_FILE} serves ${VERSION}."

      - name: Download setup installer
        id: setup
        if: ${{ needs.installer.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: native-installer
          path: installer

      # Fail-soft: the ZIP release is complete at this point; the EXE joins the version release and the rolling
      # download (same downgrade guard as the ZIP: a newer rolling title is left alone).
      - name: Publish setup installer
        if: ${{ steps.setup.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          exe="installer/${INSTALLER_FILE}"
          [ -f "$exe" ] || { echo "::warning::${INSTALLER_FILE} is not in the artifact"; exit 1; }
          tag="${{ steps.target.outputs.tag }}"
          rolling="${{ steps.rolling.outputs.tag }}"
          gh release upload "$tag" "$exe" -R "$GITHUB_REPOSITORY" --clobber
          mkdir -p setup-back
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p "$INSTALLER_FILE" -O setup-back/version.exe --clobber
          cmp setup-back/version.exe "$exe"
          current=$(gh release view "$rolling" -R "$GITHUB_REPOSITORY" --json name -q .name | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+$' || true)
          if [ -n "$current" ] && [ "$current" != "$VERSION" ] \
             && [ "$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -1)" = "$current" ]; then
            echo "::notice::${rolling} already serves ${current}, newer than ${VERSION}; setup installer left unchanged."
            exit 0
          fi
          if [ "$MODE" != release ]; then
            mkdir -p setup-placeholder
            echo placeholder > "setup-placeholder/${INSTALLER_FILE}"
            gh release upload "$rolling" "setup-placeholder/${INSTALLER_FILE}" -R "$GITHUB_REPOSITORY" --clobber
          fi
          bash deploy/native/swap-rolling-asset.sh "$GITHUB_REPOSITORY" "$rolling" "$exe" \
            "$INSTALLER_FILE" "$ROLLING_INSTALLER_STAGED_FILE" "$ROLLING_INSTALLER_PREVIOUS_FILE"

      - name: Upload publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-publish-evidence
          path: |
            current-stable.json
            merged-stable.json
            published-stable.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Delete dry-run releases
        if: always() && inputs.mode == 'release-dry-run'
        # A draft release has no git tag yet, so there is no tag to clean up (--cleanup-tag answers 422).
        env:
          DRYRUN_TAG: ${{ steps.target.outputs.tag }}
          ROLLING_DRYRUN_TAG: ${{ steps.rolling.outputs.tag }}
        run: |
          status=0
          for tag in "$DRYRUN_TAG" "$ROLLING_DRYRUN_TAG"; do
            [ -n "$tag" ] || continue
            gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes || status=1
          done
          exit $status

  # Read-only check after publish has finished: stable.json and artifacts.native are already written, the setup
  # installer step stays fail-soft, and nothing here can hold them back. It turns the run red when the public office-PC
  # download (ZIP and EXE on office-pc) does not serve this release, e.g. after a red installer job or a failed swap;
  # the download itself is left on the last good version. Runs whenever the version is known, also when publish was
  # skipped or failed, so the summary always states what the download serves. A newer rolling title is not an error.
  verify-office-pc:
    name: verify office-PC download
    needs: [ui, publish]
    if: ${{ always() && inputs.mode == 'release' && needs.ui.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.ui.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Klacks.Api
        uses: actions/checkout@v4

      - name: office-pc serves this release
        run: |
          bash deploy/native/verify-rolling-download.sh "$GITHUB_REPOSITORY" "$VERSION" "$ROLLING_TAG" \
            "$PACKAGE_FILE" "$INSTALLER_FILE"
