# .github/workflows/native-office-pc-check.yml for Klacks.Api
#
# Manual, read-only check of the public office-PC download: the rolling prerelease office-pc must serve the given
# release (title names it, ZIP and setup EXE carry the same SHA-256 digests as on v<version>). Same script as the
# verify-office-pc job of native-windows.yml, which runs it automatically at the end of every stable release.
# Changes nothing; a red result means the download is stale (repair: re-run all jobs of that native release run).

name: Native office-PC download check

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release to check, X.Y.Z (e.g. 1.0.49)'
        required: true

permissions:
  contents: read

env:
  ROLLING_TAG: 'office-pc'
  PACKAGE_FILE: 'klacks-office-pc-win-x64.zip'
  INSTALLER_FILE: 'Klacks-Setup-win-x64.exe'

jobs:
  verify:
    name: verify office-PC download (${{ inputs.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Klacks.Api
        uses: actions/checkout@v4

      - name: office-pc serves this release
        run: |
          bash deploy/native/verify-rolling-download.sh "$GITHUB_REPOSITORY" "$VERSION" "$ROLLING_TAG" \
            "$PACKAGE_FILE" "$INSTALLER_FILE"
