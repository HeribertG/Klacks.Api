# .github/workflows/onprem-linux-smoke.yml for Klacks.Api
#
# Customer-view smoke test of the Linux Docker installation on amd64 (ubuntu-latest). It does exactly what the
# store page tells a customer to do: download the country ZIP from the Klacks Store, unzip it (exec bits dropped,
# as some extraction tools do), run `sudo bash ./install-<cc>.sh` without a terminal, then checks the result the
# way a customer would see it: every container healthy, https://localhost answers, the first-start setup with the
# printed setup code creates the own admin, that admin can sign in, and the API runs the version stable.json
# announces. The ZIP is built by Klacks.Marketplace (RegionArtifactService), so this also catches bundle defects
# such as a missing update-public-key.pem that the repository tests cannot see.
#
# Nothing secret is stored: the setup code is generated by install.sh on the runner (blanked in the installer
# output, masked afterwards), the admin password is generated here and masked. The seeded test account and its
# password are public (README.md); the test expects that account to be refused while the setup code is open.
# Diagnostics never include .env (database password, JWT secret, DataProtection certificate).
# Each run counts as one download in the store statistics (RegionDownloadLog).

name: On-prem Linux smoke (customer view)

on:
  workflow_dispatch:
    inputs:
      country:
        description: 'Country code of the store package (two letters, e.g. ch, de, at)'
        required: false
        default: 'ch'
  schedule:
    - cron: '17 4 * * 1'
  workflow_run:
    workflows: ['Test & Deploy Klacks.Api to Hetzner']
    types: [completed]

permissions:
  contents: read

env:
  DEFAULT_COUNTRY: 'ch'
  STORE_BASE_URL: 'https://klacks-software.ch/store'
  STORE_INDUSTRY: 'all'
  STORE_ARTIFACT: 'onpremZip'
  MANIFEST_URL: 'https://github.com/HeribertG/Klacks.Api/releases/latest/download/stable.json'
  HTTP_USER_AGENT: 'klacks-onprem-smoke/1.0 (GitHub Actions)'
  CURL_TIMEOUTS: "--connect-timeout 15 --max-time 120"
  CURL_DOWNLOAD_TIMEOUTS: "--connect-timeout 15 --max-time 600"
  APP_URL: 'https://localhost'
  INSTALL_DIR_NAME: 'klacks'
  HEALTHCHECKED_CONTAINERS: 'klacks-postgres klacks-api klacks-ui klacks-proxy'
  UPDATER_CONTAINER: 'klacks-updater'
  HEALTH_TIMEOUT_SECONDS: '1800'
  HEALTH_POLL_SECONDS: '15'
  UPDATER_OBSERVE_SECONDS: '120'
  SEED_ADMIN_EMAIL: 'admin@test.com'
  SEED_ADMIN_PASSWORD: 'P@ssw0rt1'
  SMOKE_ADMIN_EMAIL: 'smoke.admin@example.com'
  SMOKE_ADMIN_FIRST_NAME: 'Smoke'
  SMOKE_ADMIN_LAST_NAME: 'Test'
  VERSION_PATH: '/api/Version'
  FIRST_START_STATUS_PATH: '/api/backend/Setup/FirstStartStatus'
  COMPLETE_FIRST_START_PATH: '/api/backend/Setup/CompleteFirstStart'
  LOGIN_PATH: '/api/backend/Accounts/LoginUser'
  MANIFEST_FALLBACK_MARKER: 'Falling back to :latest tags'
  MISSING_KEY_MARKER: 'update-public-key.pem missing'
  SETUP_CODE_LINE_MARKER: 'Your setup code:'

jobs:
  install:
    name: install from the store (amd64)
    # After a release: only a successful run of a stable tag (vX.Y.Z), not main pushes, dispatches or prereleases.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v') &&
       !contains(github.event.workflow_run.head_branch, '-'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Job level, so the skipped workflow_run runs of every main push never queue against a real one.
    concurrency:
      group: onprem-linux-smoke
      cancel-in-progress: false
    env:
      COUNTRY_INPUT: ${{ inputs.country }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || '' }}

    steps:
      - name: Resolve country and expected version
        run: |
          set -euo pipefail
          country="$(printf '%s' "${COUNTRY_INPUT:-$DEFAULT_COUNTRY}" | tr '[:upper:]' '[:lower:]')"
          [[ "$country" =~ ^[a-z]{2}$ ]] || { echo "::error::Invalid country code '$country' (two letters expected)."; exit 1; }

          manifest="$(curl -fsSL $CURL_DOWNLOAD_TIMEOUTS --retry 3 --retry-all-errors "$MANIFEST_URL")"
          expected="$(jq -r '.latestVersion // empty' <<<"$manifest")"
          [[ "$expected" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::stable.json has no usable latestVersion ('$expected')."; exit 1; }
          if [ -n "$RELEASE_TAG" ] && [ "v$expected" != "$RELEASE_TAG" ]; then
            echo "::error::Release $RELEASE_TAG finished, but stable.json announces $expected."
            exit 1
          fi

          {
            echo "COUNTRY=$country"
            echo "EXPECTED_VERSION=$expected"
            echo "INSTALL_DIR=$HOME/$INSTALL_DIR_NAME"
          } >> "$GITHUB_ENV"
          echo "Country $country, expected version $expected"

      - name: Runner facts
        run: |
          set -euo pipefail
          uname -m
          [ "$(uname -m)" = x86_64 ] || { echo "::error::This smoke test is meant for amd64."; exit 1; }
          nproc
          free -h
          df -h / "$HOME"
          docker version --format 'Docker {{.Server.Version}}'
          docker compose version

      - name: Download the country package from the store
        run: |
          set -euo pipefail
          download_dir="$RUNNER_TEMP/store-download"
          mkdir -p "$download_dir"
          zip_file="$download_dir/klacks-onprem-$COUNTRY-$STORE_INDUSTRY.zip"
          url="$STORE_BASE_URL/api/regions/$COUNTRY/download?industry=$STORE_INDUSTRY&artifact=$STORE_ARTIFACT"
          echo "GET $url"
          result="$(curl -sS $CURL_DOWNLOAD_TIMEOUTS --retry 3 --retry-all-errors -A "$HTTP_USER_AGENT" -o "$zip_file" \
            -w '%{http_code} %{content_type} %{size_download}' "$url")"
          echo "Store answered: $result"
          read -r status content_type _ <<<"$result"
          [ "$status" = 200 ] || { echo "::error::Store download answered HTTP $status."; exit 1; }
          [[ "$content_type" == application/zip* ]] || { echo "::error::Store download is '$content_type', not a ZIP."; exit 1; }

          unzip -l "$zip_file"
          required="install.sh install-$COUNTRY.sh update-public-key.pem docker-compose.yml regions/$COUNTRY.json nginx/nginx.onprem.conf.template init-scripts/00_validate_extensions.sql"
          entries="$(unzip -Z1 "$zip_file")"
          missing=""
          for entry in $required; do
            grep -qxF "$entry" <<<"$entries" || missing="$missing $entry"
          done
          [ -z "$missing" ] || { echo "::error::The store package lacks:$missing"; exit 1; }
          echo "ZIP_FILE=$zip_file" >> "$GITHUB_ENV"

      - name: Unzip like a browser download (no exec bits)
        run: |
          set -euo pipefail
          mkdir -p "$INSTALL_DIR"
          unzip -q -o "$ZIP_FILE" -d "$INSTALL_DIR"
          chmod -R a-x,a+X "$INSTALL_DIR"
          executable="$(find "$INSTALL_DIR" -type f -perm /111)"
          [ -z "$executable" ] || { echo "::error::Files still executable: $executable"; exit 1; }

          crlf=""
          for script in "$INSTALL_DIR"/*.sh; do
            if grep -q $'\r' "$script"; then crlf="$crlf $(basename "$script")"; fi
          done
          [ -z "$crlf" ] || { echo "::error::Shell scripts with Windows line endings:$crlf"; exit 1; }
          ls -la "$INSTALL_DIR"

      - name: Run the installer without a terminal
        run: |
          set -euo pipefail
          cd "$INSTALL_DIR"
          # The setup code is read from .env below; the printed copy is blanked before it reaches the public log.
          sudo bash "./install-$COUNTRY.sh" </dev/null 2>&1 | sed -E "s/($SETUP_CODE_LINE_MARKER +)[A-Z0-9-]+/\1***/" \
            | tee "$RUNNER_TEMP/install.log"

          if grep -qF "$MANIFEST_FALLBACK_MARKER" "$RUNNER_TEMP/install.log"; then
            echo "::error::install.sh could not read stable.json and fell back to :latest."
            exit 1
          fi
          if grep -qF "$MISSING_KEY_MARKER" "$RUNNER_TEMP/install.log"; then
            echo "::error::install.sh found no update-public-key.pem in the package."
            exit 1
          fi

          pinned="$(sudo grep -m1 '^KLACKS_API_TAG=' .env | cut -d= -f2-)" || true
          [ "$pinned" = "$EXPECTED_VERSION" ] || { echo "::error::.env pins KLACKS_API_TAG=$pinned, expected $EXPECTED_VERSION."; exit 1; }
          region="$(sudo grep -m1 '^REGION_SETUP_FILE=' .env | cut -d= -f2-)" || true
          [ "$region" = "/app/regions/$COUNTRY.json" ] || { echo "::error::.env has REGION_SETUP_FILE=$region."; exit 1; }

          setup_code="$(sudo grep -m1 '^KLACKS_SETUP_CODE=' .env | cut -d= -f2-)" || true
          [ -n "$setup_code" ] || { echo "::error::install.sh wrote no KLACKS_SETUP_CODE."; exit 1; }
          echo "::add-mask::$setup_code"
          echo "SETUP_CODE=$setup_code" >> "$GITHUB_ENV"

      - name: Wait until every container is healthy
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + HEALTH_TIMEOUT_SECONDS ))
          while :; do
            pending=""
            for container in $HEALTHCHECKED_CONTAINERS; do
              state="$(docker inspect --format '{{.State.Status}}/{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container" 2>/dev/null || echo missing/missing)"
              case "$state" in
                running/healthy) ;;
                exited/*|dead/*|missing/*) echo "::error::$container is $state."; exit 1 ;;
                *) pending="$pending $container=$state" ;;
              esac
            done
            [ -z "$pending" ] && break
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Not healthy after ${HEALTH_TIMEOUT_SECONDS}s:$pending"
              exit 1
            fi
            echo "waiting:$pending"
            sleep "$HEALTH_POLL_SECONDS"
          done
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'

      - name: https://localhost answers
        run: |
          set -euo pipefail
          result="$(curl -k -sS $CURL_TIMEOUTS -o "$RUNNER_TEMP/index.html" -w '%{http_code} %{content_type}' "$APP_URL/")"
          echo "$APP_URL/ -> $result"
          read -r status content_type <<<"$result"
          [ "$status" = 200 ] || { echo "::error::$APP_URL/ answered HTTP $status."; exit 1; }
          [[ "$content_type" == text/html* ]] || { echo "::error::$APP_URL/ served '$content_type'."; exit 1; }

      - name: API runs the released version
        run: |
          set -euo pipefail
          body="$(curl -k -fsS $CURL_TIMEOUTS "$APP_URL$VERSION_PATH")"
          echo "$body"
          running="$(jq -r '"\(.major // .Major).\(.minor // .Minor).\(.patch // .Patch)"' <<<"$body")"
          [ "$running" = "$EXPECTED_VERSION" ] || { echo "::error::API runs $running, stable.json announces $EXPECTED_VERSION."; exit 1; }

      - name: First start with the setup code, then sign in
        run: |
          set -euo pipefail
          status_body="$(curl -k -fsS $CURL_TIMEOUTS "$APP_URL$FIRST_START_STATUS_PATH")"
          echo "FirstStartStatus: $status_body"
          [ "$(jq -r '.requiresOwnAdmin' <<<"$status_body")" = true ] || { echo "::error::A fresh installation does not ask for the own admin."; exit 1; }
          [ "$(jq -r '.requiresSetupCode' <<<"$status_body")" = true ] || { echo "::error::A remote first start does not ask for the setup code."; exit 1; }

          seed_login="$(jq -n --arg e "$SEED_ADMIN_EMAIL" --arg p "$SEED_ADMIN_PASSWORD" '{email:$e,password:$p}')"
          seed_status="$(curl -k -sS $CURL_TIMEOUTS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            --data "$seed_login" "$APP_URL$LOGIN_PATH")"
          echo "Seed admin sign-in while the setup code is open: HTTP $seed_status"
          [ "$seed_status" = 401 ] || { echo "::error::The public seed admin password bypasses the setup code (HTTP $seed_status)."; exit 1; }

          password="Sm0ke-$(openssl rand -hex 12)!"
          echo "::add-mask::$password"
          echo "SMOKE_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
          registration="$(jq -n --arg e "$SMOKE_ADMIN_EMAIL" --arg f "$SMOKE_ADMIN_FIRST_NAME" --arg l "$SMOKE_ADMIN_LAST_NAME" \
            --arg p "$password" --arg c "$SETUP_CODE" '{email:$e,firstName:$f,lastName:$l,password:$p,setupCode:$c}')"
          setup_status="$(curl -k -sS $CURL_TIMEOUTS -o "$RUNNER_TEMP/first-start.json" -w '%{http_code}' -H 'Content-Type: application/json' \
            --data "$registration" "$APP_URL$COMPLETE_FIRST_START_PATH")"
          echo "CompleteFirstStart: HTTP $setup_status"
          [ "$setup_status" = 200 ] || { cat "$RUNNER_TEMP/first-start.json"; echo "::error::First start with the setup code failed (HTTP $setup_status)."; exit 1; }

          login="$(jq -n --arg e "$SMOKE_ADMIN_EMAIL" --arg p "$password" '{email:$e,password:$p}')"
          login_status="$(curl -k -sS $CURL_TIMEOUTS -o "$RUNNER_TEMP/login.json" -w '%{http_code}' -H 'Content-Type: application/json' \
            --data "$login" "$APP_URL$LOGIN_PATH")"
          echo "Own admin sign-in: HTTP $login_status"
          [ "$login_status" = 200 ] || { echo "::error::The own admin cannot sign in (HTTP $login_status)."; exit 1; }
          [ "$(jq -r '.token // empty | length > 0' "$RUNNER_TEMP/login.json")" = true ] || { echo "::error::Sign-in returned no token."; exit 1; }
          [ "$(jq -r '.isAdmin' "$RUNNER_TEMP/login.json")" = true ] || { echo "::error::The own admin is not an administrator."; exit 1; }

      - name: Updater keeps running
        run: |
          set -euo pipefail
          # klacks-updater has no healthcheck (neither compose nor image), so "running and not restarting" is the
          # strongest signal. Restarts before this point are ignored: the updater may race the first migration.
          before="$(docker inspect --format '{{.State.Status}} {{.RestartCount}}' "$UPDATER_CONTAINER")"
          sleep "$UPDATER_OBSERVE_SECONDS"
          after="$(docker inspect --format '{{.State.Status}} {{.RestartCount}}' "$UPDATER_CONTAINER")"
          echo "$UPDATER_CONTAINER before: $before, after ${UPDATER_OBSERVE_SECONDS}s: $after"
          read -r status_after restarts_after <<<"$after"
          read -r _ restarts_before <<<"$before"
          [ "$status_after" = running ] || { echo "::error::$UPDATER_CONTAINER is $status_after."; exit 1; }
          [ "$restarts_after" = "$restarts_before" ] || { echo "::error::$UPDATER_CONTAINER restarted during the observation."; exit 1; }

      - name: Collect diagnostics
        if: failure() || cancelled()
        run: |
          set +e
          diag="$RUNNER_TEMP/diagnostics"
          mkdir -p "$diag"
          cp "$RUNNER_TEMP/install.log" "$diag/" 2>/dev/null
          docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}' > "$diag/docker-ps.txt" 2>&1
          for container in $(docker ps -a --format '{{.Names}}'); do
            docker inspect --format '{{json .State}}' "$container" > "$diag/state-$container.json" 2>&1
          done
          if [ -d "${INSTALL_DIR:-}" ]; then
            (cd "$INSTALL_DIR" && sudo docker compose logs --no-color --timestamps) > "$diag/compose.log" 2>&1
          fi
          free -h > "$diag/memory.txt" 2>&1
          df -h > "$diag/disk.txt" 2>&1
          for secret_var in SETUP_CODE SMOKE_ADMIN_PASSWORD; do
            if [ -n "${!secret_var:-}" ]; then
              SECRET_VALUE="${!secret_var}" find "$diag" -type f -exec perl -pi -e 's/\Q$ENV{SECRET_VALUE}\E/***/g' {} +
            fi
          done

      - name: Upload diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: onprem-linux-smoke-${{ env.COUNTRY || 'unknown' }}-${{ github.run_id }}
          path: ${{ runner.temp }}/diagnostics
          if-no-files-found: ignore
          retention-days: 14
