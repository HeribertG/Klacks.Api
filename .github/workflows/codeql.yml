name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

# CodeQL scanning (security-and-quality) for this repo's C# code. This is a public repo, so code
# scanning is free and the SARIF upload works without GitHub Advanced Security. Buildless mode
# (build-mode: none) avoids needing a restore of the sibling dependency repos.
# The .NET SDK is pinned to 10 for the scan: runner images that ship SDK 11 as default resolve far
# fewer dependencies in buildless mode (database quality 69 % call targets / 76 % known types), which
# flooded the run with ~29,900 results and GitHub rejected the upload (limit 25,000). With SDK 10 the
# same suite yields ~1,700 results.
jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pin .NET SDK 10 for the buildless extraction
        run: |
          echo '{ "sdk": { "version": "10.0.100", "rollForward": "latestFeature" } }' > global.json
          dotnet --version

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: none
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"
