# Builds and pushes the Klacks PostgreSQL image (PostgreSQL + pgvector, deploy/postgres/Dockerfile) to
# ghcr.io/heribertg/klacks-postgres for linux/amd64 and linux/arm64. The pgvector regression suite runs inside the
# build; a failing test fails the build and nothing is pushed.
#
# Tags: :<major> (floating, used by CI service containers and the compose files) and
# :<postgres version>-pgvector<pgvector version> (stable per version pair; a rebuild of the same pair overwrites it),
# both read from the Dockerfile's ARG defaults.
#
# A package pushed for the first time with GITHUB_TOKEN is private: make it public once in the GitHub package settings,
# otherwise CI service containers and on-prem installations cannot pull it.
name: PostgreSQL image

on:
  push:
    branches: [main]
    paths:
      - 'deploy/postgres/**'
      - '.github/workflows/postgres-image.yml'
  workflow_dispatch:

concurrency:
  group: postgres-image
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/heribertg/klacks-postgres
  DOCKERFILE: deploy/postgres/Dockerfile

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout Klacks.Api
      uses: actions/checkout@v4

    - name: Read versions from the Dockerfile
      id: versions
      run: |
        read_arg() { sed -n "s/^ARG $1=\(.*\)$/\1/p" "$DOCKERFILE" | head -n1; }
        PG_MAJOR="$(read_arg PG_MAJOR)"
        PG_VERSION="$(read_arg PG_VERSION)"
        PGVECTOR_VERSION="$(read_arg PGVECTOR_VERSION)"
        if [[ ! "$PG_MAJOR" =~ ^[0-9]+$ ]] || [ -z "$PG_VERSION" ] || [ -z "$PGVECTOR_VERSION" ]; then
          echo "::error::Could not read PG_MAJOR/PG_VERSION/PGVECTOR_VERSION from $DOCKERFILE"; exit 1
        fi
        PG_UPSTREAM="${PG_VERSION%%-*}"
        {
          echo "tags<<EOF"
          echo "$IMAGE_NAME:$PG_MAJOR"
          echo "$IMAGE_NAME:$PG_UPSTREAM-pgvector${PGVECTOR_VERSION#v}"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push klacks-postgres (linux/amd64, linux/arm64)
      uses: docker/build-push-action@v6
      with:
        context: deploy/postgres
        file: ${{ env.DOCKERFILE }}
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.versions.outputs.tags }}

    - name: Smoke test (pgvector available on the pushed image)
      run: |
        image="$IMAGE_NAME:$(sed -n 's/^ARG PG_MAJOR=\(.*\)$/\1/p' "$DOCKERFILE" | head -n1)"
        docker run -d --name pgsmoke -e POSTGRES_PASSWORD=smoke "$image"
        # The entrypoint's temporary init server listens on the socket only; TCP answers once the real server runs.
        for attempt in $(seq 1 60); do
          if docker exec pgsmoke pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then break; fi
          sleep 2
        done
        docker exec -e PGPASSWORD=smoke pgsmoke psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c "CREATE EXTENSION vector;" \
          -c "SELECT version();" -c "SELECT extversion FROM pg_extension WHERE extname = 'vector';" \
          -c "SELECT '[1,2,3]'::vector <-> '[1,2,4]'::vector AS distance;"
        docker rm -f pgsmoke
