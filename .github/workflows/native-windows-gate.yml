# .github/workflows/native-windows-gate.yml for Klacks.Api
#
# Manual entry to the native Windows pipeline (native-windows.yml). gate: build, package, install and check only.
# release-dry-run: additionally rehearse the publish on a draft release that is deleted at the end; run it green
# before the first release that carries native artifacts.

name: Native Windows gate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'gate = install checks only; release-dry-run = also rehearse the publish on a draft release'
        type: choice
        options: [gate, release-dry-run]
        default: gate
      ui_version:
        description: 'Klacks.Ui release whose ghcr image provides the UI (e.g. 1.0.42); empty = latest v* tag'
        required: false
        default: ''

concurrency:
  group: native-windows-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  native:
    uses: ./.github/workflows/native-windows.yml
    with:
      mode: ${{ inputs.mode }}
      ui_version: ${{ inputs.ui_version }}
    secrets: inherit
