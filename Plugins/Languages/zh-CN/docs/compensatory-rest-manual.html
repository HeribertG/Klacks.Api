<h3>补休</h3>
<p>
  这些设置控制补休：如果两次值班之间的法定最短休息时间未达到，则必须在规定期限内补足缺失的休息时间作为补休。这些值作为全公司范围的默认值。
</p>

<h4>启用补休</h4>
<p>
  开启或关闭补休检查。如果该选项被禁用，则期限不适用。
</p>
<ul>
  <li>默认值：<strong>禁用</strong>。</li>
</ul>

<h4>期限（天）</h4>
<p>
  在未达到最短休息时间后，必须给予补休的天数。
</p>
<ul>
  <li>从 <strong>0</strong> 开始的整数值。</li>
  <li>示例：<code>14</code> 表示补休必须在两周内完成。</li>
</ul>

<h4>标准休息时间的来源</h4>
<p>
  触发补休的标准休息时间阈值源自<strong>计划规则中的最短休息时间</strong>（计划规则/标准值），并且可以在那里编辑；它不在此卡片中维护。如果您在那里更改最短休息时间，也会影响补休。
</p>
