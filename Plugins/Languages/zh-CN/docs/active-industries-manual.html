<h3>活跃行业</h3>
<p>
  Klacks 为五个行业提供模板内容：居家护理、医疗卫生、安保、设施服务和物流。此卡片用于设置
  这些行业中哪些对贵公司为启用状态。
</p>

<h4>该选择的作用</h4>
<p>
  只有已启用行业的模板（例如排班规则模板和资质模板）会出现在应用程序的选择列表中。
  停用某个行业只会过滤这些列表。
</p>
<ul>
  <li>已停用行业的模板会被<strong>保留</strong> — 不会删除任何内容。</li>
  <li>重新启用某个行业后，其模板会立即重新可见。</li>
</ul>

<h4>默认值</h4>
<p>
  如果该设置从未保存过，则<strong>所有五个行业均处于启用状态</strong>。
</p>

<h4>校验</h4>
<p>
  至少需保留一个启用的行业。空的选择不会被保存；
  在重新选择至少一个行业之前，卡片会显示提示信息。
</p>
