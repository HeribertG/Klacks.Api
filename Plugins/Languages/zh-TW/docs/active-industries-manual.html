<h3>啟用的產業</h3>
<p>
  Klacks 為五個產業提供範本內容：居家照護、醫療保健、保全、設施服務與物流。這張卡片用來控制
  貴公司將哪些產業視為啟用中。
</p>

<h4>選擇會產生什麼效果</h4>
<p>
  只有啟用產業的範本（例如排班規則與資格範本）才會出現在應用程式的選單中。
  停用某個產業只會篩選這些選單，不會有其他影響。
</p>
<ul>
  <li>停用產業的範本會<strong>保留</strong> — 不會刪除任何內容。</li>
  <li>重新啟用某個產業後，其範本會立即再次顯示。</li>
</ul>

<h4>預設值</h4>
<p>
  若此設定尚未儲存過，則<strong>所有五個產業皆為啟用狀態</strong>。
</p>

<h4>驗證</h4>
<p>
  至少必須保留一個啟用的產業。空白的選擇不會被儲存；
  在重新選取至少一個產業之前，卡片會持續顯示提示。
</p>
