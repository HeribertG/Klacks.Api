<h3>補休</h3>
<p>
  這些設定控制補休：若兩次班次之間的法定最短休息時間未達標準，則必須在特定期限內補足缺少的休息時間作為補休。這些數值適用於全公司，作為預設規範。
</p>

<h4>啟用補休</h4>
<p>
  開啟或關閉補休檢查。若停用此選項，則不套用該期限。
</p>
<ul>
  <li>預設值：<strong>停用</strong>。</li>
</ul>

<h4>期限（天數）</h4>
<p>
  在未達最短休息時間後，必須在多少天內提供補休。
</p>
<ul>
  <li>整數值，從 <strong>0</strong> 開始。</li>
  <li>範例：<code>14</code> 表示補休必須在兩週內完成。</li>
</ul>

<h4>標準休息時間的來源</h4>
<p>
  觸發補休的標準休息時間門檻值，是從<strong>規劃規範中的最短休息時間</strong>（規劃規則／標準值）推導而來，並可在該處編輯；此處不維護該值。若在該處變更最短休息時間，也會影響補休。
</p>
